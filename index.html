<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="밥 보고">
<meta name="format-detection" content="telephone=no">

<title>밥 보고</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#f3f4f6;color:#111;padding:10px 10px 90px}
h1{font-size:21px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
h1 small{font-size:13px;color:#6b7280;font-weight:400}
.recipe{display:flex;gap:8px;margin-bottom:8px}
.recipe div{flex:1;background:#16a34a;color:#fff;border-radius:12px;text-align:center;padding:6px 4px}
.recipe b{display:block;font-size:28px;line-height:1.1}
.recipe span{font-size:13px}
.pot{content-visibility:auto;contain-intrinsic-size:auto 220px;background:#fff;border-radius:12px;padding:8px;margin-bottom:8px}
.pot .h{font-size:15px;font-weight:800;margin-bottom:6px;display:flex;justify-content:space-between}
.pot .h i{font-style:normal;color:#16a34a}
.row{display:flex;gap:6px}
.tile{flex:1;border:3px solid #e5e7eb;border-radius:10px;height:170px;position:relative;overflow:hidden;background:#f9fafb}
.tile.done{border-color:#16a34a}
.tile.nx{border-color:#f59e0b;border-style:dashed}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 85%}
.tile .ref{opacity:.6}
.tile .lb{position:absolute;left:0;right:0;top:0;background:rgba(0,0,0,.7);color:#fff;font-size:14px;font-weight:800;text-align:center;padding:3px 2px}.tile .lb b{color:#fde047}
.tile .tm{position:absolute;right:3px;top:28px;border-radius:6px;padding:1px 5px!important;background:rgba(22,163,74,.9);color:#fff;font-size:13px;font-weight:700;text-align:center;padding:2px}
.tile .cam{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:30px;line-height:58px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.tile.nx .cam{background:#f59e0b}
.tile .ex{font-weight:700;color:#111!important;position:absolute;left:0;right:0;top:27px;background:rgba(255,255,255,.85);color:#6b7280;font-size:11px;text-align:center;padding:2px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:8px 10px;background:#f3f4f6}
#send{width:100%;padding:16px;border:0;border-radius:14px;background:#fee500;color:#191919;font-size:19px;font-weight:800}
#send:disabled{background:#d1d5db;color:#6b7280}
#reset{padding:3px 8px;border:2px solid #dc2626;border-radius:10px;background:#fff;color:#dc2626;font-size:13px;font-weight:800;line-height:1.15}
#reset small{display:block;font-size:10px;font-weight:600;color:#dc2626}
.cfg{width:100%;padding:12px;font-size:22px;font-weight:800;border:2px solid #d1d5db;border-radius:10px;margin-top:4px}
#ins{position:fixed;left:8px;right:8px;bottom:84px;background:#111827;color:#fff;border-radius:14px;padding:14px 40px 14px 14px;font-size:15px;line-height:1.5;display:none;z-index:5;box-shadow:0 4px 16px rgba(0,0,0,.35)}
#ins b{color:#fde047}#ins small{color:#d1d5db;font-size:12px}
#ins .x{position:absolute;right:6px;top:6px;background:none;border:0;color:#fff;font-size:22px;padding:4px 8px}
#ins .go{display:block;width:100%;margin-top:10px;padding:12px;border:0;border-radius:10px;background:#fde047;color:#111;font-size:17px;font-weight:800;text-align:center;text-decoration:none}
.sh{display:inline-block;width:22px;height:22px;border:2px solid #fff;border-radius:5px;text-align:center;line-height:16px;font-size:14px;vertical-align:-5px}
.link{background:none;border:0;color:#6b7280;font-size:13px;text-decoration:underline;padding:6px}
#busy{position:fixed;inset:0;background:rgba(0,0,0,.45);color:#fff;font-size:20px;font-weight:700;display:none;align-items:center;justify-content:center}
.ov{position:fixed;inset:0;background:#fff;padding:16px;overflow:auto;display:none}
.ov li{list-style:none;border-bottom:1px solid #e5e7eb;padding:8px 0;font-size:14px;white-space:pre-line}
.btn{padding:8px 14px;border:0;border-radius:10px;background:#111;color:#fff;font-size:16px;font-weight:700}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:20px}
.dlg div{background:#fff;border-radius:14px;padding:18px;width:100%;max-width:340px;font-size:16px;line-height:1.5}
.dlg input{width:100%;padding:12px;font-size:20px;border:2px solid #d1d5db;border-radius:10px;margin:10px 0}
.dlg .bs{display:flex;gap:8px;margin-top:8px}.dlg .bs button{flex:1;padding:12px;border:0;border-radius:10px;font-size:16px;font-weight:700}
</style>
</head>
<body>
<h1><span style="display:flex;align-items:center;gap:8px"><button id="reset">🔄 처음부터<small>Start over</small></button>🍚 밥 보고</span><small id="today"></small></h1>
<div class="recipe">
  <div><span>쌀만 · Rice only</span><b id="hR">800g</b></div>
  <div><span>물만 · Water only</span><b id="hW">1100g</b></div>
</div>
<div style="font-size:15px;font-weight:700;margin-bottom:8px;color:#374151">Tap the photo to open the camera</div>
<div id="steps"></div>
<div style="text-align:center"><button class="link" id="insBtn" hidden>📲 설치 방법 Install</button> <button class="link" id="admBtn">관리자</button></div>
<div class="bar"><button id="send" disabled>💬 카톡 공유</button></div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<div id="ins"><button class="x" id="insX">✕</button><div id="insTxt"></div></div>
<div id="busy">사진 처리 중… Processing…</div>
<div class="ov" id="adm"><h1>관리자 <button class="btn" id="admClose">닫기</button></h1>
<div style="background:#f3f4f6;border-radius:12px;padding:12px;margin-bottom:14px">
<div style="font-weight:800;margin-bottom:8px">⚖️ 기준 중량 변경</div>
<label style="display:block;font-weight:700">🍚 쌀량 (g)<input id="cR" type="number" inputmode="numeric" class="cfg"></label>
<label style="display:block;font-weight:700;margin-top:8px">💧 물량 (g)<input id="cW" type="number" inputmode="numeric" class="cfg"></label>
<button class="btn" id="cSave" style="width:100%;margin-top:10px;padding:14px;background:#16a34a">저장</button>
<div id="cMsg" style="color:#16a34a;font-weight:700;text-align:center;margin-top:6px"></div>
</div>
<div style="font-weight:800;margin-bottom:4px">보고 내역</div><ul id="hist"></ul></div>
<div class="dlg" id="dlg"><div><div id="dMsg"></div><input id="dIn" type="password" inputmode="numeric"><div class="bs"><button id="dNo" style="background:#e5e7eb">취소</button><button id="dOk" style="background:#111;color:#fff">확인</button></div></div></div>

var CFG={r:800,w:1100};try{var c=JSON.parse(localStorage.getItem('riceCfg')||'null');if(c&&c.r&&c.w)CFG=c}catch(e){}
var N=6,PARTS=[{k:'r',l:'쌀만',en:'Rice only',ref:REF_R},{k:'w',l:'물만',en:'Water only',ref:REF_W}];
function applyCfg(){PARTS[0].g=CFG.r+'g';PARTS[1].g=CFG.w+'g';PARTS.forEach(function(p){p.ex=p.en+' '+p.g});document.getElementById('hR').textContent=CFG.r+'g';document.getElementById('hW').textContent=CFG.w+'g'}
applyCfg();
var state={},cur=null,DB=null;
var $=function(id){return document.getElementById(id)};
function hm(d){d=new Date(d);return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
function md(d){d=new Date(d);return (d.getMonth()+1)+'/'+d.getDate()+'('+'일월화수목금토'[d.getDay()]+')'}
$('today').textContent=md(Date.now());
function has(k){return state[k]&&state[k].blob}

/* 촬영 순서: 1번 쌀 → 1번 물 → 2번 쌀 → … → 6번 물 */
var ORDER=[];for(var i=1;i<=N;i++){ORDER.push(i+'r',i+'w')}
function nextKey(){for(var j=0;j<ORDER.length;j++)if(!has(ORDER[j]))return ORDER[j];return null}
function label(k){var p=PARTS.filter(function(x){return x.k==k.slice(-1)})[0];return k[0]+'번 '+p.l+' '+p.g}

/* 사진 임시 저장 (느린 폰에서 카메라 다녀오며 새로고침돼도 유지) */
function db(cb){if(DB)return cb(DB);try{var r=indexedDB.open('ricerep6',1);r.onupgradeneeded=function(){r.result.createObjectStore('p')};r.onsuccess=function(){DB=r.result;cb(DB)};r.onerror=function(){cb(null)}}catch(e){cb(null)}}
function put(k,v){db(function(d){if(!d)return;try{var st=d.transaction('p','readwrite').objectStore('p');v===undefined?st.delete(k):st.put(v,k)}catch(e){}})}
function loadAll(cb){db(function(d){if(!d)return cb();try{var q=d.transaction('p').objectStore('p').openCursor();q.onsuccess=function(){var c=q.result;if(c){state[c.key]=c.value;c.continue()}else cb()};q.onerror=function(){cb()}}catch(e){cb()}})}

function render(){
  var nk=nextKey(),h='';
  for(var i=1;i<=N;i++){
    var full=has(i+'r')&&has(i+'w');
    h+='<div class="pot"><div class="h">'+i+'번 밥솥'+(full?'<i>✔ 보고 가능</i>':'')+'</div><div class="row">';
    PARTS.forEach(function(p){
      var k=i+p.k,v=state[k];
      if(has(k))h+='<div class="tile done" data-k="'+k+'"><img src="'+(v.url||(v.url=URL.createObjectURL(v.blob)))+'"><div class="lb">'+p.l+' <b>'+p.g+'</b></div><div class="tm">✔ '+hm(v.time)+'</div></div>';
      else h+='<div class="tile'+(k==nk?' nx':'')+'" data-k="'+k+'">'+(p.ref?'<img class="ref" src="'+p.ref+'">':'')+'<div class="lb">'+p.l+' <b>'+p.g+'</b></div><div class="ex">'+p.ex+'</div><div class="cam">📷</div></div>';
    });
    h+='</div></div>';
  }
  $('steps').innerHTML=h;
  var n=0;for(i=1;i<=N;i++)if(has(i+'r')&&has(i+'w'))n++;
  $('send').disabled=!n;$('send').innerHTML='💬 카톡 공유'+(n?' (밥솥 '+n+'개)':'')+'<br><small style="font-size:13px;font-weight:600">Share to KakaoTalk</small>';
}

function openCam(k){cur=k;$('cam').value='';$('cam').click()}
$('steps').onclick=function(e){var t=e.target;while(t&&t!==this&&!t.getAttribute('data-k'))t=t.parentNode;if(t&&t!==this)openCam(t.getAttribute('data-k'))};

/* 사진 축소: 느린 폰에서도 빠르게, 공유 용량 작게 */
function shrink(file,cb){
  var MAX=800;
  function draw(src,w,h){var r=Math.min(1,MAX/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*r);c.height=Math.round(h*r);c.getContext('2d').drawImage(src,0,0,c.width,c.height);c.toBlob(function(b){c.width=c.height=0;cb(b||file)},'image/jpeg',0.6)}
  function viaImg(){var u=URL.createObjectURL(file),i=new Image();i.decoding='async';i.onload=function(){draw(i,i.naturalWidth,i.naturalHeight);URL.revokeObjectURL(u)};i.onerror=function(){cb(file)};i.src=u}
  /* 느린 폰: 큰 원본을 통째로 풀지 않고 작은 크기로 바로 디코딩 */
  if(window.createImageBitmap){
    createImageBitmap(file,{imageOrientation:'from-image',resizeHeight:MAX,resizeQuality:'medium'})
      .then(function(bm){draw(bm,bm.width,bm.height);bm.close&&bm.close()}).catch(viaImg);
  }else viaImg();
}
function setPhoto(k,b,time){delete COMB[parseInt(k,10)];var old=state[k];if(old&&old.url)URL.revokeObjectURL(old.url);state[k]={blob:b,time:time};put(k,{blob:b,time:time})}
$('cam').onchange=function(){
  var f=this.files&&this.files[0];if(!f||!cur)return;var k=cur;
  if(f.lastModified&&Date.now()-f.lastModified>180000){ask('갤러리 사진은 안 됩니다.<br>지금 카메라로 직접 찍어주세요.<br><small>No gallery photos. Please take a photo now.</small>',false,function(){});return}
 $('busy').style.display='flex';
  shrink(f,function(b){setPhoto(k,b,Date.now());$('busy').style.display='none';render();setTimeout(prebuild,50)});
};
function reportText(){
  var t='🍚 밥 보고 '+md(Date.now())+'\n(쌀 '+CFG.r+'g / 물 '+CFG.w+'g)\n';
  for(var i=1;i<=N;i++){
    if(!(has(i+'r')&&has(i+'w')))continue;
    t+='\n'+i+'번  쌀 '+hm(state[i+'r'].time)+' · 물 '+hm(state[i+'w'].time);
  }
  return t;
}
/* 밥솥 1개 = 사진 1장 (쌀|물 나란히 + 이름·중량·시간 글씨). 안드로이드는 한 번에 10장까지만 공유돼서 최대 6장으로 합침 */
var COMB={};
function loadBm(blob){
  if(window.createImageBitmap)return createImageBitmap(blob).catch(function(){return viaImgBm(blob)});
  return viaImgBm(blob);
}
function viaImgBm(blob){return new Promise(function(ok,no){var u=URL.createObjectURL(blob),i=new Image();i.onload=function(){ok(i)};i.onerror=no;i.src=u})}
function combine(i){
  if(COMB[i])return Promise.resolve(COMB[i]);
  var r=state[i+'r'],w=state[i+'w'];
  return Promise.all([loadBm(r.blob),loadBm(w.blob)]).then(function(bm){
    var H=800,TOP=64,LB=58;
    var w1=Math.round(bm[0].width*H/bm[0].height),w2=Math.round(bm[1].width*H/bm[1].height);
    var c=document.createElement('canvas');c.width=w1+w2+8;c.height=TOP+H;
    var x=c.getContext('2d');x.fillStyle='#16a34a';x.fillRect(0,0,c.width,c.height);
    x.fillStyle='#fff';x.font='bold 38px sans-serif';x.textBaseline='middle';
    x.fillText(md(r.time)+'  '+i+'번 밥솥',16,TOP/2);
    x.drawImage(bm[0],0,TOP,w1,H);x.drawImage(bm[1],w1+8,TOP,w2,H);
    [[0,w1,'쌀만 '+CFG.r+'g',r.time],[w1+8,w2,'물만 '+CFG.w+'g',w.time]].forEach(function(t){
      x.fillStyle='rgba(0,0,0,.7)';x.fillRect(t[0],TOP,t[1],LB);
      x.fillStyle='#fde047';x.font='bold 36px sans-serif';x.fillText(t[2]+'  '+hm(t[3]),t[0]+14,TOP+LB/2);
    });
    bm.forEach(function(b){b.close&&b.close()});
    return new Promise(function(ok){c.toBlob(function(b){c.width=c.height=0;COMB[i]=b;ok(b)},'image/jpeg',0.6)});
  });
}
function readyPots(){var a=[];for(var i=1;i<=N;i++)if(has(i+'r')&&has(i+'w'))a.push(i);return a}
/* 사진 찍자마자 미리 합쳐 둠 → 공유 버튼 누르면 바로 뜸 */
function prebuild(){readyPots().reduce(function(p,i){return p.then(function(){return combine(i)})},Promise.resolve()).catch(function(){})}
$('send').onclick=function(){
  var text=reportText(),pots=readyPots();if(!pots.length)return;
  var allReady=pots.every(function(i){return COMB[i]});
  if(!allReady){$('busy').style.display='flex';$('busy').textContent='사진 준비 중… Preparing…'}
  Promise.all(pots.map(combine)).then(function(bl){
    $('busy').style.display='none';
    var files=bl.map(function(b,j){return new File([b],'rice'+pots[j]+'.jpg',{type:'image/jpeg'})});
    if(!(navigator.canShare&&navigator.canShare({files:files})))return copy(text);
    navigator.share({files:files}).then(function(){saveHist(text)}).catch(function(e){
      if(e&&e.name==='AbortError')return;
      if(!allReady)ask('사진 준비가 끝났어요. 공유 버튼을 한 번 더 눌러주세요.<br><small>Ready. Tap Share again.</small>',false,function(){});
      else copy(text);
    });
  }).catch(function(){$('busy').style.display='none';copy(text)});
};
function copy(t){try{navigator.clipboard.writeText(t).then(function(){ask('사진 공유가 안 됐어요. 크롬(Chrome)에서 열어 다시 눌러주세요.<br><small>Photo share failed. Open in Chrome and try again.</small>',false,function(){})})}catch(e){}}
function saveHist(t){try{var h=JSON.parse(localStorage.getItem('riceHist')||'[]');h.unshift(t);localStorage.setItem('riceHist',JSON.stringify(h.slice(0,200)))}catch(e){}}

/* 가벼운 화면 안 대화상자 */
function ask(msg,input,cb){$('dMsg').innerHTML=msg;$('dIn').style.display=input?'block':'none';$('dIn').value='';$('dlg').style.display='flex';if(input)$('dIn').focus();
  $('dOk').onclick=function(){$('dlg').style.display='none';cb($('dIn').value)};$('dNo').onclick=function(){$('dlg').style.display='none'}}
$('reset').onclick=function(){ask('🔄 사진을 모두 지우고 처음부터 할까요?<br><small>Delete all photos and start over?</small>',false,function(){for(var k in state){if(state[k].url)URL.revokeObjectURL(state[k].url);put(k)}state={};COMB={};render()})};
$('admBtn').onclick=function(){ask('관리자 비밀번호',true,function(v){if(v!=='5324')return;var h=[];try{h=JSON.parse(localStorage.getItem('riceHist')||'[]')}catch(e){}$('hist').innerHTML=h.length?h.map(function(x){return '<li>'+x.replace(/</g,'&lt;')+'</li>'}).join(''):'<li>내역 없음</li>';$('cR').value=CFG.r;$('cW').value=CFG.w;$('cMsg').textContent='';$('adm').style.display='block'})};
$('cSave').onclick=function(){var r=parseInt($('cR').value,10),w=parseInt($('cW').value,10);if(!(r>0&&w>0)){$('cMsg').style.color='#dc2626';$('cMsg').textContent='숫자를 입력하세요';return}CFG={r:r,w:w};COMB={};try{localStorage.setItem('riceCfg',JSON.stringify(CFG))}catch(e){}applyCfg();render();$('cMsg').style.color='#16a34a';$('cMsg').textContent='✔ 저장됨: 쌀 '+r+'g / 물 '+w+'g'};
$('admClose').onclick=function(){$('adm').style.display='none'};


/* ===== 설치 / 바로가기 ===== */
var UA=navigator.userAgent,isIOS=/iPhone|iPad|iPod/.test(UA)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),
    isKakao=/KAKAOTALK/i.test(UA),inApp=isKakao||/NAVER|Instagram|FBAN|FBAV|Line\//i.test(UA),
    standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true,deferred=null;
function showIns(force){
  if(standalone)return;
  try{if(!force&&localStorage.getItem('riceInsX'))return}catch(e){}
  var h;
  if(inApp){
    h='📲 <b>바로가기를 만들려면 인터넷 앱에서 여세요</b><br><small>Open in browser to add to home screen</small>'+
      (isKakao?'<a class="go" href="kakaotalk://web/openExternal?url='+encodeURIComponent(location.href)+'">🌐 브라우저로 열기 Open</a>':
      '<br>오른쪽 위/아래 <b>⋯</b> → <b>다른 브라우저로 열기</b>');
  }else if(isIOS){
    h='📲 <b>아이폰 바로가기 만들기</b><br>① 아래 <span class="sh">⬆</span> <b>공유</b> 버튼 누르기<br>② <b>홈 화면에 추가</b> 누르기<br>③ 오른쪽 위 <b>추가</b><br><small>Tap Share ⬆ → Add to Home Screen → Add</small>';
  }else if(deferred){
    h='📲 <b>홈 화면에 앱 설치</b><br><small>Install app on home screen</small><button class="go" id="insGo">📲 설치하기 Install</button>';
  }else{
    h='📲 <b>바로가기 만들기</b><br>오른쪽 위 <b>⋮</b> → <b>홈 화면에 추가</b> (또는 <b>앱 설치</b>)<br><small>Menu ⋮ → Add to Home screen</small>';
  }
  $('insTxt').innerHTML=h;$('ins').style.display='block';
  var g=$('insGo');if(g)g.onclick=function(){deferred.prompt();deferred.userChoice.then(function(){deferred=null;$('ins').style.display='none'})};
}
$('insX').onclick=function(){$('ins').style.display='none';try{localStorage.setItem('riceInsX','1')}catch(e){}};
if(!standalone){$('insBtn').hidden=false;$('insBtn').onclick=function(){showIns(true)}}
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;showIns(false)});
window.addEventListener('appinstalled',function(){$('ins').style.display='none';$('insBtn').hidden=true});
/* 카톡 등 앱 안 브라우저로 열리면 → 자동으로 새 창(기본 브라우저)으로 열기 */
(function(){
  if(standalone||!inApp)return;
  var url=location.href;
  if(isKakao){location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(url);return}
  if(/Android/i.test(UA)&&location.protocol==='https:'){location.href='intent://'+url.replace(/^https:\/\//,'')+'#Intent;scheme=https;package=com.android.chrome;end';}
})();
setTimeout(function(){showIns(false)},800);
if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js')});

render();loadAll(function(){render();setTimeout(prebuild,300)});
</script>
